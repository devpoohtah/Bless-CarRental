{% set active = active_nav | default('') %}
<aside id="admin-sidebar" class="admin-sidebar on-dark">
  <a class="admin-brand" href="/admin/dashboard">
    <img class="admin-brand__logo" src="{{ static_url('shared/img/bless-logo.webp') }}" alt="" width="40" height="40">
    <span class="admin-brand__text">
      <span class="admin-brand__name">{{ site.short_name }}</span>
      <span class="admin-brand__sub">Admin</span>
    </span>
  </a>
  <nav class="admin-nav" aria-label="Admin">
    <a class="admin-nav__link" href="/admin/dashboard"{% if active == 'dashboard' %} aria-current="page"{% endif %}>{{ icon('layout-dashboard', 'icon') }}<span>Dashboard</span></a>
    <p class="admin-nav__label" id="nav-services">Service Management</p>
    <a class="admin-nav__link" href="/admin/services/cars"{% if active == 'cars' %} aria-current="page"{% endif %}>{{ icon('car-front', 'icon') }}<span>Cars</span></a>
    <a class="admin-nav__link" href="/admin/services/tours"{% if active == 'tours' %} aria-current="page"{% endif %}>{{ icon('compass', 'icon') }}<span>Tour Packages</span></a>
  </nav>
</aside>
