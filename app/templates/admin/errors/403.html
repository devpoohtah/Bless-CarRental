{% extends 'admin/base.html' %}
{% block title %}Forbidden | {{ site.short_name }} Admin{% endblock %}

{% block content %}
<div class="admin-error">
  <div class="admin-error__card">
    <div class="admin-error__icon">{{ icon('shield-alert', 'icon icon--xl') }}</div>
    <h1 class="admin-error__code">403</h1>
    <h2 class="admin-error__title">Not authorized</h2>
    <p class="admin-error__message">You don't have permission to access this page.</p>
    <div class="admin-error__actions">
      <a class="btn btn--primary" href="/admin/dashboard">Back to dashboard</a>
      <a class="btn btn--outline" href="javascript:history.back()">Go back</a>
    </div>
  </div>
</div>
{% endblock %}
