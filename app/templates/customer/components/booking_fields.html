{# Form pieces both booking pages use. #}
{% macro calendar(hint) %}
<div class="field field--wide book__calendar">
  <p class="book__calendar-title" id="bk-calendar-title">Choose your dates</p>
  <div class="book__calendar-box" role="group" aria-labelledby="bk-calendar-title"><div id="bk-calendar"></div></div>
  <p class="field__hint">{{ hint }} Crossed-out dates are already booked. You can also type the dates below.</p>
</div>
{% endmacro %}

{% macro contact_fields() %}
<fieldset>
  <legend>Your information</legend>
  <div class="booking-form__grid">
    <div class="field field--wide">
      <label for="bk-name">Full name</label>
      <input id="bk-name" name="customer_name" type="text" maxlength="120" autocomplete="name" required>
    </div>
    <div class="field">
      <label for="bk-phone">Contact number</label>
      <input id="bk-phone" name="customer_phone" type="tel" maxlength="40" autocomplete="tel" required aria-describedby="bk-phone-hint">
      <p class="field__hint" id="bk-phone-hint">We use this to reach you about your request.</p>
    </div>
    <div class="field">
      <label for="bk-email">Email (optional)</label>
      <input id="bk-email" name="customer_email" type="email" maxlength="120" autocomplete="email">
    </div>
  </div>
</fieldset>
{% endmacro %}
