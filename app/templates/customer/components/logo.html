{% macro brand_logo() %}
<a href="{{ nav_base }}#home" class="brand" aria-label="{{ site.business_name }}, back to top">
  <!-- your brand logo will go here -->
  <img class="brand__logo" src="{{ static_url('shared/img/bless-logo.webp') }}" alt="" width="56" height="56">
  <span class="brand__text">
    <span class="brand__name">Bless Travel and Tours</span>
    <span class="brand__sub">&amp; Car Rental</span>
  </span>
</a>
{% endmacro %}
