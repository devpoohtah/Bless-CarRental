{% extends 'customer/base.html' %}
{% block title %}Too Many Requests | {{ site.business_name }}{% endblock %}

{% block content %}
<section class="error-page">
  <div class="container">
    <div class="error-page__card">
      <div class="error-page__icon">{{ icon('clock', 'icon icon--xl') }}</div>
      <h1 class="error-page__code">429</h1>
      <h2 class="error-page__title">Too many requests</h2>
      <p class="error-page__message">You've made too many requests. Please wait a moment and try again.</p>
      <div class="error-page__actions">
        <a class="btn btn--primary" href="/">Back to home</a>
        <a class="btn btn--outline" href="javascript:history.back()">Go back</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
