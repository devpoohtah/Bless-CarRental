{% extends 'customer/base.html' %}
{% block title %}Forbidden | {{ site.business_name }}{% endblock %}

{% block content %}
<section class="error-page">
  <div class="container">
    <div class="error-page__card">
      <div class="error-page__icon">{{ icon('shield-alert', 'icon icon--xl') }}</div>
      <h1 class="error-page__code">403</h1>
      <h2 class="error-page__title">Not authorized</h2>
      <p class="error-page__message">You don't have permission to access this page.</p>
      <div class="error-page__actions">
        <a class="btn btn--primary" href="/">Back to home</a>
        <a class="btn btn--outline" href="javascript:history.back()">Go back</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
